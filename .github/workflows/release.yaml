name: Create Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        # Pinned to actions/checkout@v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Node.js
        # Pinned to actions/setup-node@v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Get extension name and version
        id: get_info
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./manifest.json').version")
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: ZIP extension for release
        run: |
          cd dist
          zip -r ../${{ steps.get_info.outputs.name }}-${{ steps.get_info.outputs.version }}.zip .
          cd ..

      - name: Create GitHub Release
        # Pinned to softprops/action-gh-release@v3.0.0
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: "${{ steps.get_info.outputs.name }}-${{ steps.get_info.outputs.version }}.zip"
          generate_release_notes: true
