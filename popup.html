<!doctype html>
<html>
  <head>
    <title>Accessibility Personas</title>
    <link
      rel="stylesheet"
      href="node_modules/@kern-ux/native/dist/fonts/fira-sans.css"
    />
    <link rel="stylesheet" type="text/css" href="popup_output.css" />
  </head>

  <body>
    <header class="sticky top-0 z-10 bg-kern-action-default px-12 py-18">
      <h1
        id="popup-title"
        class="kern-title kern-title--large mb-6"
        data-i18n="popupTitle"
      ></h1>
      <p
        id="popup-introduction"
        class="kern-body"
        data-i18n="popupIntroduction"
      ></p>
    </header>

    <main
      id="persona-list"
      class="kern-container-fluid kern-stack py-18"
      role="main"
    >
      <!-- Personas are inserted here with popup.js -->
    </main>

    <script src="popup.js"></script>
  </body>
</html>
